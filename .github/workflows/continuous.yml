name: continuous

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  SOLUTION: Blazor.WebAssembly.DynamicCulture.slnx
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  tests:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  build:
    name: build-and-pack
    runs-on: ubuntu-latest
    env:
      CI_VERSION: 0.0.1-ci.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore /p:Version=${{ env.CI_VERSION }}

      - name: Pack Blazor.WebAssembly.DynamicCulture.Loader
        run: dotnet pack src/Blazor.WebAssembly.DynamicCulture.Loader/Blazor.WebAssembly.DynamicCulture.Loader.csproj -c Release --no-build -o artifacts/packages /p:PackageVersion=${{ env.CI_VERSION }}

      - name: Pack Blazor.WebAssembly.DynamicCulture
        run: dotnet pack src/Blazor.WebAssembly.DynamicCulture/Blazor.WebAssembly.DynamicCulture.csproj -c Release --no-build -o artifacts/packages /p:PackageVersion=${{ env.CI_VERSION }}

      - name: Verify package contains generated JavaScript
        shell: pwsh
        run: ./scripts/Verify-PackageAssets.ps1

      - name: Upload packages artifact
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages
