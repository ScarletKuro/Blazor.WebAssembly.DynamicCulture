name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  SOLUTION: Blazor.WebAssembly.DynamicCulture.slnx
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    name: Version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Validate and extract version from tag
        id: get_version
        shell: bash
        run: |
          version="$GITHUB_REF_NAME"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$version' is not a supported release tag."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  tests:
    needs: version
    uses: ./.github/workflows/test.yml
    secrets: inherit

  publish:
    name: publish
    needs: [version, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore /p:Version=${{ needs.version.outputs.version }}

      - name: Pack Blazor.WebAssembly.DynamicCulture.Loader
        run: dotnet pack src/Blazor.WebAssembly.DynamicCulture.Loader/Blazor.WebAssembly.DynamicCulture.Loader.csproj -c Release --no-build -o artifacts/packages /p:PackageVersion=${{ needs.version.outputs.version }}

      - name: Pack Blazor.WebAssembly.DynamicCulture
        run: dotnet pack src/Blazor.WebAssembly.DynamicCulture/Blazor.WebAssembly.DynamicCulture.csproj -c Release --no-build -o artifacts/packages /p:PackageVersion=${{ needs.version.outputs.version }}

      - name: Verify package contains generated JavaScript
        shell: pwsh
        run: ./scripts/Verify-PackageAssets.ps1

      - name: List generated packages
        run: ls -lh artifacts/packages

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        run: dotnet nuget push "artifacts/packages/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate

      - name: Publish to GitHub Packages
        run: dotnet nuget push "artifacts/packages/*.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate

      - name: Upload packages artifact
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ needs.version.outputs.version }}
          path: artifacts/packages
